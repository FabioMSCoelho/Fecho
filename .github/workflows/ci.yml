name: Validar entrega

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      FECHO_DB_PASSWORD: fecho-ci-local-only
      MYSQL_ROOT_PASSWORD: fecho-ci-root-local-only
      FECHO_DATA_DIR: /tmp/fecho-web-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Compilar sem avisos
        run: dotnet build Fecho.slnx --configuration Release --disable-build-servers -m:1
      - name: Executar os cenários de negócio
        run: dotnet tests/Fecho.Testes/bin/Release/net10.0/Fecho.Testes.dll
      - name: Executar a demonstração
        run: dotnet src/Fecho.Console/bin/Release/net10.0/Fecho.Console.dll
      - name: Validar CRUD com MySQL real
        run: |
          docker compose up -d --wait
          dotnet tests/Fecho.Integracao/bin/Release/net10.0/Fecho.Integracao.dll
      - name: Validar preenchimento e ampliacao dos exemplos
        env:
          FECHO_TEST_DEMO: '1'
          FECHO_DEMO_PASSWORD: fecho-demo-ci-local-only
        run: dotnet tests/Fecho.Web.Testes/bin/Release/net10.0/Fecho.Web.Testes.dll --demo
      - name: Validar MVP Web e regras de acesso
        run: bash scripts/validar-web.sh --no-build
      - name: Parar banco de teste
        if: always()
        run: docker compose down
